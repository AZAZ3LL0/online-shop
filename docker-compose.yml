# Nginx is the only service that publishes ports to the host. The app and
# database are reachable only on the internal Docker network.

services:
  app:
    build: .
    # No published ports — Nginx reaches the app over the internal network.
    expose:
      - "8080"
    env_file: .env
    environment:
      # Point the app at the db service (overrides any host-local DATABASE_URL
      # in .env). sslmode=disable is acceptable on the private compose network.
      DATABASE_URL: postgres://qzq_kiim:${DB_PASSWORD}@db:5432/qzq_kiim?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    # No published ports — never expose the database to the host/internet.
    environment:
      POSTGRES_DB:       qzq_kiim
      POSTGRES_USER:     qzq_kiim
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qzq_kiim"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./static:/srv/static:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:
