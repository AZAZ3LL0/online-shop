name: gate

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.25"
  TEMPL_VERSION: v0.3.898
  TAILWIND_VERSION: v3.4.17
  GOLANGCI_VERSION: v2.1.6

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/shop?sslmode=disable
      APP_ENV: dev
      APP_BASE_URL: http://localhost:8080
      APP_SECRET: ci-secret-ci-secret-ci-secret-32b
      PAYMENTS_PROVIDER: fake
      TELEGRAM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install generators
        run: |
          go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}
          curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x /usr/local/bin/tailwindcss

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '_templ.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: templ generate --check
        run: |
          templ generate
          git diff --exit-code -- '*_templ.go'

      - name: tailwind build
        run: tailwindcss -c tailwind.config.js -i web/static/css/input.css -o web/static/css/app.css --minify

      - name: go vet
        run: go vet ./...

      # Installed with go install instead of the action: the action resolves the
      # version on its own and a v1 binary rejects this v2 config with exit 3.
      # This is the exact command the Makefile gate runs, so CI cannot drift.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}
          golangci-lint config verify
          golangci-lint run

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: migrations on an ephemeral postgres
        run: go run ./cmd/app migrate

      - name: seed
        run: go run ./cmd/app seed

      - name: tests
        run: go test ./... -race

      - name: docker build
        run: docker build -f docker/Dockerfile -t qzq-shop:ci .
