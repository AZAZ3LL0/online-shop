name: deploy

# Runs only after the gate is green on main, never in parallel with itself.
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: deploy over ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose --env-file .env -f docker/compose.yml build
            docker compose --env-file .env -f docker/compose.yml run --rm app migrate
            docker compose --env-file .env -f docker/compose.yml up -d

            # The release is not done until the public probe answers over the
            # same URL the shop is served on.
            set -a; . ./.env; set +a
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 5 "$APP_BASE_URL/healthz" >/dev/null; then
                echo "healthz ok"
                exit 0
              fi
              sleep 2
            done
            echo "healthz never came up" >&2
            exit 1
