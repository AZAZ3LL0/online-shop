{{define "content"}}
<main class="page-cart">
  <div class="cart-wrap">

    <h1 class="cart-title">
      <span class="mono">cart</span><span class="logo-dot">.</span>
    </h1>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-total-row" id="cart-total-row" style="display:none;">
      <span class="mono order-label">итого</span>
      <span class="mono cart-total-val" id="cart-total-val">—</span>
    </div>

    {{if .Error}}
    <div class="error-msg">{{.Error}}</div>
    {{end}}

    <div id="checkout-form-wrap" style="display:none;">
      <h2 class="section-title mono">checkout()</h2>

      <form id="checkout-form" method="POST" action="/order/create">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label mono">name</label>
            <input class="form-input" name="name" placeholder="Имя и фамилия" required>
          </div>
          <div class="form-group">
            <label class="form-label mono">email</label>
            <input class="form-input" name="email" type="email" placeholder="email@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label mono">phone</label>
            <input class="form-input" name="phone" type="tel" placeholder="+7 (___) ___-__-__" required>
          </div>
          <div class="form-group">
            <label class="form-label mono">city</label>
            <input class="form-input" name="city" placeholder="Город" required>
          </div>
          <div class="form-group form-group--full">
            <label class="form-label mono">address</label>
            <input class="form-input" name="street" placeholder="Улица, дом, кв." required>
          </div>
        </div>

        <div class="checkout-note mono">
          После оформления получишь ссылку на заказ — сохрани её, по ней отследишь статус без регистрации.
        </div>

        <input type="hidden" name="cart_json" id="cart-json-input">
        <button type="submit" class="btn-pay" onclick="fillCartInput()">
          оформить заказ →
        </button>
      </form>
    </div>

  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  renderCartPage();
});

function renderCartPage() {
  var cart = getCart();
  var container = document.getElementById('cart-items');
  var totalRow = document.getElementById('cart-total-row');
  var totalVal = document.getElementById('cart-total-val');
  var formWrap = document.getElementById('checkout-form-wrap');

  if (!cart.items || cart.items.length === 0) {
    container.innerHTML =
      '<p class="cart-empty mono">корзина пуста</p>' +
      '<div class="cart-empty-cta"><a href="/" class="btn-to-shop mono">← вернуться в магазин</a></div>';
    totalRow.style.display = 'none';
    formWrap.style.display = 'none';
    return;
  }

  var html = '';
  var total = 0;
  cart.items.forEach(function(item) {
    var itemTotal = item.price * item.quantity;
    total += itemTotal;
    html +=
      '<div class="cart-item">' +
        '<div class="cart-item-info">' +
          '<span class="cart-item-name mono">' + item.product_name + '</span>' +
          '<span class="cart-item-meta"> · ' + item.size + ' · ×' + item.quantity + '</span>' +
        '</div>' +
        '<div class="cart-item-controls">' +
          '<span class="cart-item-price mono">' + fmtPrice(itemTotal) + ' ₸</span>' +
          '<button class="cart-item-remove mono" ' +
            'onclick="removeCartItem(' + item.product_id + ', \'' + item.size + '\')" ' +
            'title="удалить">×</button>' +
        '</div>' +
      '</div>';
  });

  container.innerHTML = html;
  totalVal.textContent = fmtPrice(total) + ' ₸';
  totalRow.style.display = 'flex';
  formWrap.style.display = 'block';
}

function fmtPrice(tiyn) {
  return Math.round(tiyn / 100).toLocaleString('ru-RU');
}

function fillCartInput() {
  document.getElementById('cart-json-input').value =
    localStorage.getItem('qzq_cart') || '{"items":[]}';
}
</script>
{{end}}
